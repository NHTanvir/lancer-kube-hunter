[package]
name = "lancer-kube-hunter"
version = "0.1.0"
edition = "2021"
description = "Rust clone of kube-hunter — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-kube-hunter"

[dependencies]
clap       = { version = "4.5",  features = ["derive"] }
tokio      = { version = "1",    features = ["full"] }
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest    = { version = "0.12", features = ["json", "rustls-tls"] }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
comfy-table = "7"
colored    = "2"
semver     = { version = "1",    features = ["serde"] }
regex      = "1"
ipnet      = "2"
async-trait = "0.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
